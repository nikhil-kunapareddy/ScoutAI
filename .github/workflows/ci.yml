name: CI

# The suite scripts the chat models and stubs every HTTP call, so CI needs no
# secrets and reaches no network. Nothing here should ever need an API key.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy
      - name: requirements are generated from pyproject
        run: python scripts/sync_requirements.py --check

  test:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest --cov --cov-report=term-missing

  package:
    name: wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install build
      - run: python -m build
      - name: install the wheel and use the console script
        # `scout agents` imports every agent and every tool module, so this
        # fails if the wheel is missing a package or a dependency.
        run: |
          pip install dist/*.whl
          cd "$(mktemp -d)"
          scout --help
          scout agents
