# The single source of truth for dependencies and tool configuration.
# requirements.txt mirrors [project.dependencies] for the deploy path, and
# tests/test_packaging.py fails if the two ever drift apart.

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scout"
description = "A multi-agent job-search assistant that lives in your Slack DMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sai Nikhil Kunapareddy" }]
keywords = ["langgraph", "slack-bot", "ai-agents", "claude", "job-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Read from scout/__init__.py, so the package and the distribution cannot
# disagree about what version this is.
dynamic = ["version"]
dependencies = [
    "slack-bolt>=1.30.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-core>=1.6.3",
    "langchain-anthropic>=1.7.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pypdf>=6.18.1",
    "docx2txt>=0.8",
    # Agent observability: the per-turn call tree, wired up in core/tracing.py.
    # `langchain` is not imported anywhere in this package — langfuse's LangChain
    # integration imports it to tell v0 from v1, and refuses to load without
    # it — so it is a dependency of the handler, not of Scout.
    "langfuse>=4.0.0",
    "langchain>=1.4.0",
]

[project.optional-dependencies]
# Linters are pinned: a new release must not turn a green pull request red on
# its own. Dependabot proposes the bumps, CI proves them.
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/nikhil-kunapareddy/ScoutAI"
Documentation = "https://github.com/nikhil-kunapareddy/ScoutAI/tree/main/docs"
Issues = "https://github.com/nikhil-kunapareddy/ScoutAI/issues"

[project.scripts]
scout = "scout.cli:main"

[tool.setuptools.dynamic]
version = { attr = "scout.__version__" }

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.setuptools.package-data]
scout = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite from a checkout without installing the package.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
# The package only: ``run.py`` is a three-line shim, and naming a file here
# rather than a package makes coverage warn. ``tests/test_cli.py`` still pins
# that it calls the same entry point.
source = ["scout"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The suite covers every line and every branch, so the floor is the ceiling:
# anything less means a path shipped without a test that reads it.
fail_under = 100
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.10"
files = ["scout", "run.py"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true

[[tool.mypy.overrides]]
# No type information published upstream.
module = ["docx2txt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# LangChain's chat models are pydantic models with populate-by-name aliases
# (`model` for `model_name`, `api_key` for a SecretStr field). The constructors
# accept what we pass; mypy reads the aliases as unexpected keywords.
module = ["scout.core.models"]
disable_error_code = ["call-arg", "arg-type"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # import sorting
    "B",     # bugbear
    "UP",    # pyupgrade
    "C4",    # comprehensions
    "SIM",   # simplifications
    "RUF",   # ruff's own rules
    "RET",   # return-statement hygiene
    "ISC",   # implicit string concatenation
    "LOG",   # logging call mistakes
    "A",     # shadowed builtins
    "N",     # pep8 naming
    "PTH",   # pathlib over os.path
    "PT",    # pytest style
    "ANN",   # every function is annotated
    "S",     # bandit security rules
    "D417",  # every documented function documents all its arguments
    "D419",  # no empty docstrings
]
ignore = [
    # The job tools deliberately swallow every network/parse failure so one dead
    # source can't fail a whole turn; each site documents why.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Tests are annotated where it helps a reader, not to satisfy a linter, and
# they reach into private helpers on purpose — that's where the parsing lives.
"tests/*" = [
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN205", "ANN401",
    "S101",   # asserts are the point
    "S105", "S106",  # fake tokens in fixtures
]
# The scripted chat model is a pydantic model, where a mutable default is the
# documented way to declare a field.
"tests/conftest.py" = ["RUF012"]
